name: 每週快照集保大戶持股率

on:
  schedule:
    - cron: "0 1 * * 0"   # 每週日 01:00 UTC（台灣 09:00）；TDCC 集保資料週末更新
  workflow_dispatch: {}    # 也可手動觸發

permissions:
  contents: write

concurrency:
  group: weekly-holders
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓 TDCC 並更新 data/holders
        run: python scripts/snapshot_holders.py
      - name: Commit 變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holders
          if git diff --cached --quiet; then
            echo "本週無變更"
          else
            git commit -m "data: 集保大戶持股率每週快照 $(date -u +%Y-%m-%d)"
            git push
          fi
